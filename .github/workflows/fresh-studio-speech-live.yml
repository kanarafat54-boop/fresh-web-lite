name: Fresh Studio speech engine (live)

# Runs the real Whisper model in a real browser on generated speech. It downloads a model, so it is not part of the
# normal build; run it from the Actions tab or it runs when the engine files change.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/features/fresh-studio/video-studio/speechEngine.ts"
      - "src/features/fresh-studio/video-studio/speech.ts"
      - "scripts/verify-fresh-studio-speech-live.mjs"
      - ".github/workflows/fresh-studio-speech-live.yml"

jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - name: Make a speech sample
        run: |
          espeak-ng -s 130 -w "$RUNNER_TEMP/raw.wav" "Hello everyone. Today we are testing automatic captions in Fresh Studio."
          ffmpeg -y -loglevel error -i "$RUNNER_TEMP/raw.wav" -ar 44100 -ac 2 "$RUNNER_TEMP/speech.wav"
      - name: Run the engine in Chromium
        env:
          FRESH_SPEECH_WAV: ${{ runner.temp }}/speech.wav
        run: node scripts/verify-fresh-studio-speech-live.mjs
