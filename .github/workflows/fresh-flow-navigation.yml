name: Fresh Flow Navigation Browser Test

on:
  pull_request:
    paths:
      - "src/features/fresh-flow/**"
      - "src/app/components/BottomNav.*"
      - "src/app/AppShell.tsx"
      - "scripts/browser-test-fresh-flow-navigation.mjs"
      - "scripts/browser-test-fresh-shorts.mjs"
      - "scripts/test-fresh-short-watch-signals.mjs"
      - ".github/workflows/fresh-flow-navigation.yml"
  push:
    branches: [main]
    paths:
      - "src/features/fresh-flow/**"
      - "src/app/components/BottomNav.*"
      - "scripts/browser-test-fresh-flow-navigation.mjs"
      - "scripts/browser-test-fresh-shorts.mjs"
      - "scripts/test-fresh-short-watch-signals.mjs"
      - ".github/workflows/fresh-flow-navigation.yml"

permissions:
  contents: read

concurrency:
  group: fresh-flow-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with placeholder Supabase settings (all external requests are blocked by the test)
        env:
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-not-a-real-key
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Two-navigation layout at 320/360/390/430px
        run: node scripts/browser-test-fresh-flow-navigation.mjs dist
      - name: Short watch-signal logic
        run: node scripts/test-fresh-short-watch-signals.mjs
      - name: Install ffmpeg (synthetic test clips)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Shorts pager behavior at 320/390/430px
        run: node scripts/browser-test-fresh-shorts.mjs dist
