name: Fresh AI training contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-training-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Print runtime versions
        run: |
          node --version
          npm --version
          python3 --version
      - run: npm ci
      - name: Install Fresh training backend
        run: python3 -m pip install -r training/requirements.txt
      - run: npm run test:fresh-unified-training
      - run: npm run test:fresh-unified-curriculum
      - run: npm run test:fresh-training-job
      - run: npm run test:fresh-training-backend
      - run: npm run test:fresh-model-spec
      - run: npm run test:fresh-training-model
      - run: npm run test:fresh-corpus-authorization
      - run: npm run test:fresh-corpus-candidates
      - run: npm run test:fresh-corpus-ingestion
      - run: npm run test:fresh-dataset-preparation
      - run: npm run prepare:fresh-training -- --output artifacts/fresh-training/jobs/ci-prepared.json
      - run: npm run test:fresh-training-run-record -- artifacts/fresh-training/jobs/ci-prepared.json
      - name: Verify prepared record is not a checkpoint
        run: |
          test ! -e artifacts/fresh-training/jobs/ci-prepared.safetensors
          grep -q '"execution"' artifacts/fresh-training/jobs/ci-prepared.json
          grep -q '"status": "planned"' artifacts/fresh-training/jobs/ci-prepared.json
          grep -q '"checkpointId": null' artifacts/fresh-training/jobs/ci-prepared.json
          grep -q '"checkpointSha256": null' artifacts/fresh-training/jobs/ci-prepared.json
