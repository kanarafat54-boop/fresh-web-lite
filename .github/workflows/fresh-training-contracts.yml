name: Fresh AI training contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-training-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Print runtime versions
        run: |
          node --version
          npm --version
          python3 --version
      - run: npm ci
      - name: Validate curated user-intake dataset
        run: npm run test:fresh-user-intake-dataset
      - name: Prepare curated user-intake manifest (no training)
        run: node scripts/prepare-fresh-unified-dataset.mjs data/fresh-training/user-intake-curated-v1.jsonl artifacts/fresh-training/user-intake-curated-v1.manifest.json
      - name: Verify curated manifest count and non-checkpoint status
        run: |
          grep -q '"exampleCount": 62' artifacts/fresh-training/user-intake-curated-v1.manifest.json
          grep -q '"weightsCreated": false' artifacts/fresh-training/user-intake-curated-v1.manifest.json
          grep -q '"checkpointCreated": false' artifacts/fresh-training/user-intake-curated-v1.manifest.json
      - name: Install Fresh training backend
        run: python3 -m pip install -r training/requirements.txt
      - name: Test native inference artifact integrity and promotion gates
        run: python3 -m unittest training/test_serve_fresh_unified.py
      - name: Exercise expanded authorized corpus through tokenizer and training dry-run
        run: npm run test:fresh-expanded-corpus
      - name: Verify live Fresh AI conversation endpoint
        run: node scripts/smoke-fresh-ai-production.mjs
      - run: npm run test:fresh-unified-training
      - run: npm run test:fresh-unified-curriculum
      - run: npm run test:fresh-training-job
      - run: npm run test:fresh-model-spec
      - run: npm run test:fresh-training-model
      - run: npm run test:fresh-corpus-authorization
      - run: npm run test:fresh-corpus-candidates
      - run: npm run test:fresh-corpus-ingestion
      - run: npm run test:fresh-training-promotion
      - run: npm run test:fresh-tokenizer-training
      - run: npm run test:fresh-training-backend
      - run: npm run test:fresh-dataset-preparation
      - run: node scripts/run-fresh-unified-training.mjs --dataset data/fresh-training/synthetic-starter-v1.jsonl --curriculum src/core/fresh-ai/FreshUnifiedTrainingCurriculum.ts --output artifacts/fresh-training/jobs/ci-prepared.json
      - run: npm run test:fresh-training-run-record -- artifacts/fresh-training/jobs/ci-prepared.json
      - name: Verify prepared training record is not a checkpoint
        run: |
          test ! -e artifacts/fresh-training/jobs/ci-prepared.safetensors
          grep -q '"execution"' artifacts/fresh-training/jobs/ci-prepared.json
          grep -q '"status": "planned"' artifacts/fresh-training/jobs/ci-prepared.json
          grep -q '"checkpointId": null' artifacts/fresh-training/jobs/ci-prepared.json
          grep -q '"checkpointSha256": null' artifacts/fresh-training/jobs/ci-prepared.json
