name: Fresh Mail Backend Gate

on:
  pull_request:
    paths:
      - "api/mail.ts"
      - "api/mail/**"
      - "src/features/workspaces/FreshMailPanel.*"
      - "src/features/workspaces/CommunicationWorkspace.tsx"
      - "supabase/migrations/*fresh_mail_core.sql"
      - "scripts/verify-fresh-mail-contract.mjs"
      - "docs/FRESH_MAIL_BACKEND_SETUP.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fresh-mail-gate.yml"
      - "src/server/vercelNodeAdapter.ts"
      - "scripts/test-fresh-mail-migration.sql"
  push:
    branches: [main]
    paths:
      - "api/mail.ts"
      - "api/mail/**"
      - "src/features/workspaces/FreshMailPanel.*"
      - "src/features/workspaces/CommunicationWorkspace.tsx"
      - "supabase/migrations/*fresh_mail_core.sql"
      - "scripts/verify-fresh-mail-contract.mjs"
      - "docs/FRESH_MAIL_BACKEND_SETUP.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fresh-mail-gate.yml"
      - "src/server/vercelNodeAdapter.ts"
      - "scripts/test-fresh-mail-migration.sql"

permissions:
  contents: read

concurrency:
  group: fresh-mail-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fresh_mail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fresh_mail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fresh_mail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare disposable Postgres auth roles
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          SQL
      - name: Apply Fresh Mail migration to disposable Postgres
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261015060000_fresh_mail_core.sql
      - name: Verify migration grants, RLS, uniqueness, and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/test-fresh-mail-migration.sql
      - name: Fresh Mail security and wiring contract
        run: npm run test:fresh-mail-contract
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
