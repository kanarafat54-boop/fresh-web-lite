name: Fresh AI Deployment Smoke
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Full Vercel deployment URL to smoke-test
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.target_url, '.vercel.app'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke-test Fresh AI HTTP boundaries
        env:
          DEPLOYMENT_URL: ${{ github.event.inputs.deployment_url || github.event.deployment_status.target_url }}
        run: node scripts/smoke-fresh-ai-deployment.mjs "$DEPLOYMENT_URL"
