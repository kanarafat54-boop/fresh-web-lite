name: Supabase full migration replay (isolated)

on:
  # Run for stacked PRs too (for example a search API PR based on its
  # migration-foundation PR). The isolated replay needs no Supabase preview
  # branch, credentials, or production database access.
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-full-migration-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # The repository currently has migrations but no config.toml.
      # Generate the default local-only config in this ephemeral runner;
      # do not link a remote project or provide production credentials.
      - name: Generate ephemeral local Supabase config
        run: supabase init --force

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Replay every repository migration from an empty local database
        run: supabase db reset --local --no-seed

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
