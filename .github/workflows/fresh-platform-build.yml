name: Fresh Web Lite build gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Profile runtime schema contract
        run: node scripts/verify-profile-runtime-schema.mjs
      - name: Architecture contract
        run: npm run test:fresh-ecosystem-architecture
      - name: Production routing contract
        run: npm run test:production-routing
      - name: Fresh AI profile and creator contract
        run: npm run test:fresh-ai-profile-creator-actions
      - name: Runtime capability contract
        run: npm run test:fresh-runtime-capabilities
      - name: Phase 0 messaging security contract
        run: npm run test:phase0-security
      - name: Security/auth contract
        run: npm run test:fresh-security-contract
      - name: Fresh Protofile privacy contract\n        run: npm run test:fresh-platform-privacy\n      - name: Fresh Flow fabric contract
        run: npm run test:fresh-flow-fabric
      - name: Media worker contract
        run: npm run test:fresh-media-worker-contract
      - name: Remote media worker client contract
        run: npm run test:remote-media-worker-contract
      - name: Unified media runtime contract
        run: npm run test:fresh-media-runtime
      - name: Media publishing bridge contract
        run: npm run test:fresh-media-publishing
      - name: Phases 15-22 certification
        run: npm run test:fresh-phases-15-22
      - name: Phases 15-24 certification
        run: npm run test:fresh-phases-15-24
      - name: Fresh Experience visible-product contract
        run: npm run test:fresh-experience-24
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint

  profile-schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Reproduce the prior feed-mode constraint
        run: psql --set ON_ERROR_STOP=1 --file supabase/tests/profile_schema_drift_fixture.sql
      - name: Apply feed-mode compatibility migration
        run: psql --set ON_ERROR_STOP=1 --file supabase/migrations/20261014210000_allow_fresh_picks_feed_mode.sql
      - name: Verify Fresh Flow default feed modes
        run: psql --set ON_ERROR_STOP=1 --file supabase/tests/profile_schema_drift.sql
