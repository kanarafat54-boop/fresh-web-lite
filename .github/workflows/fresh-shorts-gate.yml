name: Fresh Shorts Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fresh-shorts-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Static Shorts contract
        run: npm run test:shorts

      - name: Lint Shorts-owned changes
        run: npx eslint src/features/shorts/core/FreshShortsRuntime.ts src/features/fresh-flow/components/FreshFlowShortsExperience.tsx src/features/fresh-flow/core/shortsTelemetry.ts api/shorts/telemetry.ts

      - name: Production build
        run: npm run build
