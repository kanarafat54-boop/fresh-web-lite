name: Fresh Shorts Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fresh-shorts-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Static Shorts contract
        run: npm run test:shorts

      - name: Playlists and pinned comments contract
        run: npm run test:fresh-shorts-playlists

      - name: Shorts filters and links
        run: |
          npm run test:fresh-shorts-filters
          npm run test:fresh-shorts-why
          npm run test:fresh-shorts-reporting
          npm run test:fresh-shorts-notification-state
          npm run test:fresh-shorts-activity
          npm run test:fresh-shorts-saved
          npm run test:fresh-recent-searches
          npm run test:fresh-shorts-sound
          npm run test:fresh-shorts-history
          npm run test:fresh-shorts-duration
          npm run test:fresh-shorts-comment-reactions
          npm run test:fresh-shorts-data-saver
          npm run test:fresh-shorts-context
          npm run test:fresh-shorts-captions
          npm run test:fresh-shorts-safety

      - name: Fresh Flow performance contract
        run: node scripts/verify-fresh-flow-performance.mjs

      - name: Fresh Flow runtime fabric contract
        run: npm run test:fresh-flow-fabric

      - name: Fresh AI unified contract
        run: npm run test:fresh-ai

      - name: Fresh native dimensional contract
        run: npm run test:fresh-native-dimensions

      - name: Lint Shorts and Fresh Flow runtime changes
        run: npx eslint src/features/shorts/core/FreshShortsRuntime.ts src/features/fresh-flow/components/FreshFlowShortsExperience.tsx src/features/fresh-flow/core/shortsTelemetry.ts src/features/fresh-flow/core/freshFlowRuntimeFabric.ts src/features/fresh-flow/core/freshFlowDiscovery.ts src/features/fresh-flow/core/freshFlowMediaPolicy.ts src/features/fresh-flow/core/freshFlowRealtime.ts src/features/fresh-flow/core/freshFlowTelemetry.ts src/features/fresh-flow/components/ShortsCreatorProfile.tsx src/features/fresh-flow/core/shortsPlaylists.ts src/features/comments/components/CommentPanel.tsx api/shorts/telemetry.ts

      - name: Production build
        run: npm run build
