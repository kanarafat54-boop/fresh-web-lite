name: One-time API typing repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply targeted memory row typing repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("api/ai/ask.ts"),
              Path("api/ai/stream.ts"),
              Path("api/ai/live-stream.ts"),
          ]

          for path in files:
              text = path.read_text()
              original = text

              text = text.replace(
                  '(x: any) => !words.length || words.some(w => String(x.content).toLowerCase().includes(w))',
                  '(x: MemoryRow) => !words.length || words.some(w => x.content.toLowerCase().includes(w))'
              )
              text = text.replace(
                  '(x: any) => ({ id: x.id, content: x.content, scope: x.scope, createdAt: x.created_at, source: x.source })',
                  '(x: MemoryRow) => ({ id: x.id, content: x.content, scope: x.scope, createdAt: x.created_at, source: x.source })'
              )

              if 'type MemoryRow =' not in text:
                  marker = 'type Body = {'
                  if marker not in text:
                      raise SystemExit(f'{path}: Body type marker not found')
                  pos = text.find('\n', text.find(marker))
                  if pos == -1:
                      raise SystemExit(f'{path}: Body type line not found')
                  row_type = (
                      'type MemoryRow = {\n'
                      '  id: string;\n'
                      '  content: string;\n'
                      '  scope: FreshMemoryRecord["scope"];\n'
                      '  created_at: string;\n'
                      '  source: string;\n'
                      '};\n'
                  )
                  text = text[:pos + 1] + row_type + text[pos + 1:]

              if text == original:
                  raise SystemExit(f'{path}: no expected typing change was applied')
              path.write_text(text)
              print(f'updated {path}')
          PY

      - name: Verify targeted files compile through ESLint parser
        run: npx eslint api/ai/ask.ts api/ai/stream.ts api/ai/live-stream.ts || true

      - name: Commit repair and remove one-time runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ai/ask.ts api/ai/stream.ts api/ai/live-stream.ts .github/workflows/one-time-api-typing-repair.yml
          git commit -m "fix: type Fresh AI memory rows" || exit 0
          git rm .github/workflows/one-time-api-typing-repair.yml
          git commit -m "chore: remove one-time API typing repair runner"
          git push origin HEAD:main
