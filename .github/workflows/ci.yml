name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run build --if-present || npm run tsc --if-present || true
      - name: Lint
        run: npm run lint --if-present || true
      - name: Run tests
        run: npm test --if-present || true
