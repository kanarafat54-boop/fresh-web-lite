name: Fresh ID Device Security Gate

on:
  pull_request:
    paths:
      - "src/features/workspaces/DeviceSecurityPanel.tsx"
      - "src/features/workspaces/SettingsWorkspace.tsx"
      - "src/features/workspaces/SettingsWorkspace.css"
      - "supabase/migrations/*fresh_id_device_sessions.sql"
      - "scripts/verify-fresh-id-device-security.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fresh-id-device-security.yml"
  push:
    branches:
      - main
      - "feat/fresh-id-device-security-20261019"
    paths:
      - "src/features/workspaces/DeviceSecurityPanel.tsx"
      - "src/features/workspaces/SettingsWorkspace.tsx"
      - "src/features/workspaces/SettingsWorkspace.css"
      - "supabase/migrations/*fresh_id_device_sessions.sql"
      - "scripts/verify-fresh-id-device-security.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fresh-id-device-security.yml"

permissions:
  contents: read

concurrency:
  group: fresh-id-device-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify device security safeguards
        run: npm run test:fresh-id-device-security
      - name: Type-check application
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build
